<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <img src="img/logo.png" alt="Phinia logo">
        </div>
        <div class="title">
            <h1>PDI-Inspection</h1>
        </div>
        <div class="top-actions">
            <button type="button" class="icon-button">Params</button>
            <button type="button" class="icon-button">Login</button>
        </div>
    </header>

    <main class="app-shell">
        <section class="operation-panel fixed-left">
                <div class="panel-header">
                    <span>Operação</span>
                </div>
                <div class="operation-fields">
                    <div class="field-group">
                        <label for="serial">Serial</label>
                        <input id="serial" type="text" placeholder="Digite o serial">
                    </div>
                    <div class="field-group finalize-group">
                        <label>&nbsp;</label>
                        <button type="button" class="btn-finalize">Finalizar [F2]</button>
                    </div>
                    <div class="field-group field-group--wide">
                        <label for="modelo">Modelo</label>
                        <input id="modelo" type="text" placeholder="Digite o modelo">
                    </div>
                    <div class="field-group field-group--half">
                        <label for="id">ID</label>
                        <input id="id" type="text" placeholder="Digite o ID">
                    </div>
                    <div class="field-group field-group--half field-group--right">
                        <label for="descricao">Descrição</label>
                        <input id="descricao" type="text" placeholder="Digite a descrição">
                    </div>
                </div>
            </section>

        <section class="step-panel small-step fixed-left-step">
                <div class="panel-header panel-header--dark">
                    <span>Passo a passo</span>
                </div>
                <div class="step-table-wrapper">
                    <table class="step-table">
                        <thead>
                            <tr>
                                <th>Passo</th>
                                <th>Descrição</th>
                                <th>Especificação</th>
                                <th>Método</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>10</td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>20</td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>30</td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>40</td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td>50</td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        <section class="preview-panel preview-panel-right">
            <div class="preview-header">Imagem da bomba</div>
            <div class="preview-box large-preview">
                <span>Aparecerá aqui</span>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <div class="footer-left">
            <strong>Usuário:</strong> Nome do operador
        </div>
        <div class="footer-right">
            <span>1º Turno 0 OK 0 NOK</span>
            <span>2º Turno 0 OK 0 NOK</span>
            <span>3º Turno 0 OK 0 NOK</span>
        </div>
    </footer>
</body>
</html>
